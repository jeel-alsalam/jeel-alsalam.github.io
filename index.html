<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="منصة مدرسة جيل السلام للتعليم الأساسي (١-٤): خطط المدرسة وأنشطتها ومبادراتها في مكان واحد.">
<title>منصة جيل السلام</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=Tajawal:wght@400;500;700&display=swap">
<style>
/* Layout: colorful animated hero (school scene) → values ribbon → stats → section tiles, each section owns a color; section view = colored banner + folder tiles */
:root{
  --bg:#FFFBF4; --surface:#FFFFFF; --ink:#1E2A4A; --muted:#5E6886; --line:#EDE6DA;
  --sky:#2F8CF0; --sun:#FFC233; --coral:#FF6B5A; --mint:#16B88A; --grape:#7C5CFF; --pink:#F2559A;
  --hero-a:#DDF0FF; --hero-b:#FFF1D2;
  --tint:.12;
  --display:"Baloo Bhaijaan 2","Tajawal",Tahoma,sans-serif;
  --body:"Tajawal",Tahoma,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12162B; --surface:#1B2140; --ink:#EEF1FF; --muted:#A9B1D6; --line:#2C3460;
  --sky:#5AA8FF; --sun:#FFCF5C; --coral:#FF8576; --mint:#3FD3A6; --grape:#9C85FF; --pink:#FF78B1;
  --hero-a:#1C2A55; --hero-b:#2A2448; --tint:.2; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12162B; --surface:#1B2140; --ink:#EEF1FF; --muted:#A9B1D6; --line:#2C3460;
  --sky:#5AA8FF; --sun:#FFCF5C; --coral:#FF8576; --mint:#3FD3A6; --grape:#9C85FF; --pink:#FF78B1;
  --hero-a:#1C2A55; --hero-b:#2A2448; --tint:.2; color-scheme:dark}
*{box-sizing:border-box}
html{direction:rtl}
body{direction:rtl;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.75;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:3px}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;padding-block:10px 6px}
.logo{width:46px;height:46px;flex:none}
.bar h1{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(18px,3vw,23px);line-height:1.2}
.bar small{display:block;color:var(--muted);font-size:13px;font-family:var(--body);font-weight:500}
nav{display:flex;gap:8px;overflow-x:auto;padding-block:6px 12px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{--c:var(--sky);flex:none;font:inherit;font-size:15px;font-weight:700;border:2px solid transparent;background:color-mix(in srgb,var(--c) calc(var(--tint)*100%),transparent);color:var(--ink);padding:5px 14px;border-radius:999px;cursor:pointer;transition:transform .15s,background .15s}
nav button:hover{transform:translateY(-2px);border-color:var(--c)}
nav button[aria-current="page"]{background:var(--c);color:#fff}

main{padding-block:0 40px}

/* hero */
.hero{position:relative;margin-top:20px;border-radius:32px;background:linear-gradient(135deg,var(--hero-a),var(--hero-b));overflow:hidden;isolation:isolate}
.hero-in{display:grid;grid-template-columns:1.05fr 1fr;align-items:center;gap:10px;padding:clamp(24px,5vw,52px)}
.hero .hi{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border-radius:999px;padding:4px 14px 4px 6px;font-weight:700;font-size:14px;box-shadow:0 4px 0 color-mix(in srgb,var(--ink) 8%,transparent)}
.hero .hi i{width:26px;height:26px;border-radius:50%;background:var(--sun);display:grid;place-items:center;font-style:normal}
.hero h2{font-family:var(--display);font-weight:800;font-size:clamp(34px,6.4vw,64px);line-height:1.15;margin:16px 0 12px;text-wrap:balance}
.hero h2 .w{display:inline-block;animation:bob 3.2s ease-in-out infinite}
.hero h2 .w:nth-child(2){color:var(--coral);animation-delay:.2s}
.hero h2 .w:nth-child(3){color:var(--sky);animation-delay:.4s}
.hero p.lead{margin:0;font-size:clamp(17px,2vw,19px);color:var(--muted);max-width:40ch}
.cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.btn{font:inherit;font-weight:700;font-size:16px;border:0;cursor:pointer;border-radius:16px;padding:12px 22px;text-decoration:none;display:inline-flex;align-items:center;gap:8px;transition:transform .15s,box-shadow .15s}
.btn.main{background:var(--coral);color:#fff;box-shadow:0 5px 0 color-mix(in srgb,var(--coral) 60%,#000)}
.btn.alt{background:var(--surface);color:var(--ink);box-shadow:0 5px 0 color-mix(in srgb,var(--ink) 15%,transparent)}
.btn:hover{transform:translateY(-3px)}
.btn:active{transform:translateY(2px);box-shadow:none}
.scene{width:100%;max-width:520px;justify-self:center;overflow:visible}
.scene .sun{transform-box:fill-box;transform-origin:center;animation:spin 24s linear infinite}
.scene .arm{transform-box:fill-box;transform-origin:0% 100%;animation:waveArm 1.4s ease-in-out infinite}
.scene .arm.b{animation-delay:.35s}.scene .arm.c{animation-delay:.7s;animation-duration:1.7s}
.scene .blink{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
.scene .sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 4s ease-in-out infinite}
.scene .cloud{animation:drift 9s ease-in-out infinite alternate}
.scene .cloud.b{animation-duration:12s}
.scene .kid{animation:hop 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}
.scene .kid.b{animation-delay:.6s}.scene .kid.c{animation-delay:1.2s}
.scene .flag{animation:wave 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:left center}
.blob{position:absolute;border-radius:50%;z-index:-1;opacity:.55;filter:blur(2px)}
.blob.a{width:180px;height:180px;background:var(--sun);top:-60px;left:-40px;opacity:.35}
.blob.b{width:120px;height:120px;background:var(--pink);bottom:-40px;right:30%;opacity:.22}
.confetti{position:absolute;inset:0;z-index:-1;pointer-events:none}


/* photo hero */
.hero{background:none;border-radius:0;overflow:visible;margin-top:20px}
.photo{position:relative;margin:0;border-radius:32px;overflow:hidden;aspect-ratio:1600/873;max-width:100%;background:var(--hero-a);box-shadow:0 18px 40px -18px color-mix(in srgb,var(--ink) 45%,transparent)}
.photo .zoom{position:absolute;inset:0;animation:kenburns 22s ease-in-out infinite alternate;transform-origin:50% 60%}
.photo img{display:block;width:100%;height:100%;object-fit:cover}
.flagwave{direction:ltr;position:absolute;left:65.554%;top:5.99%;width:12.571%;aspect-ratio:354/278;display:flex}
.flagwave i{flex:1;height:100%;margin-left:-.4px;background-image:var(--flag);background-size:2400% 100%;background-repeat:no-repeat;transform-origin:0 50%;animation:flagwave 1.3s ease-in-out infinite alternate;animation-delay:calc(var(--i) * -.09s)}
@keyframes flagwave{from{transform:translateY(calc(var(--i) * -0.25%));filter:brightness(1.06)}to{transform:translateY(calc(var(--i) * 0.25%));filter:brightness(.9)}}
.photo .confetti{z-index:1}
.photo .hi{position:absolute;top:16px;right:16px;z-index:2}
.hero-card{position:relative;z-index:2;display:grid;grid-template-columns:1fr auto;gap:18px 28px;align-items:center;max-width:960px;margin:-56px auto 0;background:var(--surface);border-radius:28px;padding:clamp(18px,3.5vw,32px);border:2px solid var(--line);box-shadow:0 10px 0 color-mix(in srgb,var(--sun) 55%,transparent)}
.hero-card h2{margin:0 0 6px;font-size:clamp(30px,5vw,50px)}
.hero-card .cta{margin-top:0;flex-direction:column}
.doves{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.dove{position:absolute;width:clamp(30px,4.6vw,58px);scale:var(--s);animation:fly linear infinite}
.dove .bob{display:block;animation:bob 1.8s ease-in-out infinite}
.dove svg{display:block;width:100%;height:auto;filter:drop-shadow(0 3px 3px rgba(30,42,74,.18))}
.dove .wing{transform-box:fill-box;transform-origin:50% 100%;animation:flap .32s ease-in-out infinite alternate}
.dove .wing.far{animation-delay:.04s}
@keyframes flap{from{transform:scaleY(1)}to{transform:scaleY(-.55)}}
@keyframes fly{from{left:108%}to{left:-12%}}
@keyframes kenburns{from{transform:scale(1)}to{transform:scale(1.07)}}
@media (max-width:820px){.hero-card{grid-template-columns:1fr;margin:-28px 10px 0}.hero-card .cta{flex-direction:row}.photo{border-radius:22px}}
@media (max-width:480px){.photo .hi{top:10px;right:10px;font-size:12px}}

/* ribbon */
.ribbon{margin-top:22px;overflow:hidden;border-radius:18px;background:var(--grape);color:#fff;transform:rotate(-1deg)}
.ribbon .track{display:flex;gap:40px;width:max-content;padding-block:12px;animation:marquee 26s linear infinite;font-family:var(--display);font-weight:700;font-size:20px}
.ribbon span{display:inline-flex;align-items:center;gap:14px;white-space:nowrap}
.ribbon span::after{content:"✦";color:var(--sun)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:34px}
.stat{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:16px 18px;display:flex;align-items:center;gap:12px}
.stat b{font-family:var(--display);font-size:34px;line-height:1;font-weight:800;color:var(--c);font-variant-numeric:tabular-nums}
.stat span{font-size:14px;color:var(--muted);font-weight:500;line-height:1.4}

/* sections grid */
.h-row{display:flex;align-items:end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin:46px 0 18px}
.h-row h3{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(26px,4vw,36px);line-height:1.2}
.h-row h3 em{font-style:normal;background:linear-gradient(transparent 60%,color-mix(in srgb,var(--sun) 70%,transparent) 60%)}
.search{flex:1;max-width:340px;min-width:220px;position:relative}
.search input{width:100%;font:inherit;font-size:16px;padding:11px 44px 11px 16px;border-radius:16px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.search svg{position:absolute;right:14px;top:50%;translate:0 -50%;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px}
.card{--c:var(--sky);position:relative;display:flex;flex-direction:column;gap:4px;text-align:start;font:inherit;color:inherit;background:var(--surface);border:2px solid var(--line);border-radius:26px;padding:20px;cursor:pointer;overflow:hidden;transition:transform .2s cubic-bezier(.3,1.6,.5,1),border-color .2s,box-shadow .2s;animation:rise .5s both}
.card::before{content:"";position:absolute;width:140px;height:140px;border-radius:50%;background:var(--c);opacity:var(--tint);top:-50px;left:-40px;transition:transform .3s}
.card:hover{transform:translateY(-6px) rotate(-.6deg);border-color:var(--c);box-shadow:0 12px 0 color-mix(in srgb,var(--c) 30%,transparent)}
.card:hover::before{transform:scale(1.5)}
.card .ic{width:58px;height:58px;border-radius:18px;background:var(--c);color:#fff;display:grid;place-items:center;transform:rotate(-6deg);box-shadow:0 5px 0 color-mix(in srgb,var(--c) 55%,#000);transition:transform .25s}
.card:hover .ic{transform:rotate(6deg) scale(1.06)}
.card h4{margin:14px 0 0;font-family:var(--display);font-size:22px;font-weight:800;line-height:1.3}
.card p{margin:0;color:var(--muted);font-size:15px;line-height:1.6}
.card .count{margin-top:auto;padding-top:12px;display:flex;align-items:center;justify-content:space-between;font-size:14px;font-weight:700;color:var(--c)}
.card .count i{font-style:normal;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--c) calc(var(--tint)*100%),transparent);transition:transform .2s}
.card:hover .count i{transform:translateX(-5px)}

/* section page */
.banner{--c:var(--sky);position:relative;margin-top:20px;border-radius:30px;background:var(--c);color:#fff;padding:clamp(22px,4.5vw,40px);overflow:hidden;isolation:isolate}
.banner::after{content:"";position:absolute;width:300px;height:300px;border-radius:50%;background:#fff;opacity:.12;left:-80px;bottom:-140px;z-index:-1}
.banner::before{content:"";position:absolute;width:120px;height:120px;border-radius:40%;background:#fff;opacity:.1;left:22%;top:-50px;z-index:-1;animation:spin 20s linear infinite}
.back{font:inherit;font-size:15px;font-weight:700;background:rgba(255,255,255,.2);border:0;color:#fff;cursor:pointer;padding:6px 14px;border-radius:999px;margin-bottom:18px}
.back:hover{background:rgba(255,255,255,.32)}
.banner .row1{display:flex;gap:18px;align-items:center}
.banner .ic{width:76px;height:76px;flex:none;border-radius:24px;background:rgba(255,255,255,.22);display:grid;place-items:center;transform:rotate(-6deg);animation:bob 3s ease-in-out infinite}
.banner h2{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(30px,5.5vw,48px);line-height:1.15}
.banner p{margin:6px 0 0;opacity:.95;max-width:56ch;font-size:17px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px;margin-top:26px}
.tile{--c:var(--sky);display:flex;flex-direction:column;gap:10px;background:var(--surface);border:2px solid var(--line);border-radius:24px;padding:18px;text-decoration:none;transition:transform .2s cubic-bezier(.3,1.6,.5,1),border-color .2s,box-shadow .2s;animation:rise .45s both}
.tile:hover{transform:translateY(-6px);border-color:var(--c);box-shadow:0 10px 0 color-mix(in srgb,var(--c) 28%,transparent)}
.tile .art{height:96px;border-radius:16px;background:color-mix(in srgb,var(--c) calc(var(--tint)*100%),transparent);display:grid;place-items:center}
.tile .art svg{transition:transform .25s}
.tile:hover .art svg,.tile:hover .emo{transform:translateY(-4px) rotate(-6deg) scale(1.08)}
.tile .emo{font-size:52px;line-height:1;display:inline-block;transition:transform .25s}
.tile.soon,.feat.soon{opacity:.75;border-style:dashed}
.feat.soon:hover{transform:none;box-shadow:none}
.tile b{font-family:var(--display);font-weight:700;font-size:19px;line-height:1.35}
.tile .meta{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted)}
.tile .meta em{font-style:normal;font-weight:700;color:var(--c)}
.tip{display:flex;gap:12px;align-items:center;margin-top:26px;background:color-mix(in srgb,var(--sun) 22%,var(--surface));border-radius:18px;padding:14px 18px;font-size:15px}
.tip i{font-style:normal;font-size:24px}

/* students */
.floaters{position:absolute;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.floaters span{position:absolute;bottom:-40px;left:var(--x);font-size:clamp(20px,3vw,30px);opacity:.9;animation:floatUp var(--t) linear infinite;animation-delay:calc(var(--d) * -1)}
@keyframes floatUp{from{transform:translateY(0) rotate(-10deg)}to{transform:translateY(-360px) rotate(14deg)}}
.feats{display:grid;grid-template-columns:repeat(2,1fr);gap:22px;margin-top:26px}
.feat{position:relative;display:flex;flex-direction:column;border-radius:30px;overflow:hidden;text-decoration:none;color:var(--ink);background:var(--surface);border:2px solid var(--line);transition:transform .25s cubic-bezier(.3,1.6,.5,1),box-shadow .25s,border-color .25s;animation:rise .5s both}
.feat:hover{transform:translateY(-8px) rotate(-.5deg);border-color:var(--c);box-shadow:0 14px 0 color-mix(in srgb,var(--c) 30%,transparent)}
.feat-art{display:grid;place-items:center;padding:22px 16px 10px;background:linear-gradient(135deg,var(--c),var(--g))}
.feat-art svg{width:min(100%,280px);height:auto;overflow:visible}
.feat-body{display:flex;flex-direction:column;gap:6px;padding:20px 22px 22px}
.feat-tag{align-self:flex-start;font-size:13px;font-weight:700;color:var(--c);background:color-mix(in srgb,var(--c) calc(var(--tint)*100%),transparent);padding:2px 12px;border-radius:999px}
.feat b{font-family:var(--display);font-weight:800;font-size:clamp(24px,3.4vw,30px);line-height:1.25}
.feat-txt{color:var(--muted);font-size:16px}
.feat-go{margin-top:8px;align-self:flex-start;display:inline-flex;align-items:center;gap:8px;font-weight:700;color:#fff;background:var(--c);padding:9px 18px;border-radius:14px;box-shadow:0 4px 0 color-mix(in srgb,var(--c) 55%,#000);transition:transform .2s}
.feat:hover .feat-go{transform:translateX(-4px)}
.feat .burst{transform-box:fill-box;transform-origin:center;animation:spin 18s linear infinite}
.feat .medal{transform-box:fill-box;transform-origin:50% 0;animation:swing 2.6s ease-in-out infinite}
.feat .twinkle path{transform-box:fill-box;transform-origin:center;animation:twinkle 1.6s ease-in-out infinite}
.feat .twinkle path:nth-child(2){animation-delay:.4s}.feat .twinkle path:nth-child(3){animation-delay:.8s}.feat .twinkle path:nth-child(4){animation-delay:1.2s}
.feat .bars rect{transform-box:fill-box;transform-origin:50% 100%;animation:grow 3.2s ease-in-out infinite;animation-delay:var(--d)}
.feat .trend{stroke-dasharray:160;animation:draw 3.2s ease-in-out infinite}
.feat .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.2s ease-in-out infinite}
@keyframes swing{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
@keyframes twinkle{0%,100%{transform:scale(.6);opacity:.5}50%{transform:scale(1.15);opacity:1}}
@keyframes grow{0%{transform:scaleY(.25)}35%,85%{transform:scaleY(1)}100%{transform:scaleY(.25)}}
@keyframes draw{0%{stroke-dashoffset:160}40%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:160}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.5)}}
@media (max-width:720px){.feats{grid-template-columns:1fr}}
.igroup{margin:34px 0 0;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px}
.igroup h3{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(22px,3.4vw,28px);display:flex;align-items:center;gap:10px}
.igroup .dot{width:14px;height:14px;border-radius:50%;background:var(--c);box-shadow:0 0 0 5px color-mix(in srgb,var(--c) 25%,transparent);animation:pulse 1.6s ease-in-out infinite}
.igroup p{margin:0;color:var(--muted);font-size:15px}
.ifeats{display:grid;gap:18px;margin-top:16px}
.ifeats.four{grid-template-columns:repeat(4,1fr)}
.ifeats.three{grid-template-columns:repeat(3,1fr)}
.ifeats.auto{grid-template-columns:repeat(auto-fit,minmax(185px,1fr))}
.ifeats.auto:has(> .ifeat:only-child){grid-template-columns:minmax(0,420px)}
.feat-art.mini{position:relative;height:130px;padding:0;overflow:hidden}
.feat-art.mini .big{font-size:58px;line-height:1;animation:bob 2.4s ease-in-out infinite;filter:drop-shadow(0 6px 6px rgba(0,0,0,.18))}
.feat-art.mini .num{position:absolute;top:12px;right:14px;width:34px;height:34px;border-radius:50%;background:#fff;color:var(--c);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:19px;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.feat-art.mini .sp{position:absolute;color:#fff;font-style:normal;animation:twinkle 1.8s ease-in-out infinite}
.sp.a{top:18%;left:14%;font-size:18px}.sp.b{bottom:16%;left:30%;font-size:12px;animation-delay:.6s}.sp.c{top:24%;right:28%;font-size:14px;animation-delay:1.2s}
.feat-art.mini::after{content:"";position:absolute;width:150px;height:150px;border-radius:50%;background:#fff;opacity:.13;left:-50px;bottom:-80px;animation:spin 14s linear infinite}
.ifeat .feat-body{padding:16px 18px 18px;gap:10px;flex:1}
.ifeat b{font-size:clamp(19px,2.2vw,22px)}
.ifeat .feat-go{margin-top:auto;padding:7px 14px;font-size:15px}
.ifeat:hover .big{animation-duration:.8s}
@media (max-width:900px){.ifeats.four{grid-template-columns:repeat(2,1fr)}.ifeats.three{grid-template-columns:repeat(2,1fr)}}
@media (max-width:480px){.ifeats.four,.ifeats.three{grid-template-columns:1fr}}

.flagimg{display:block;width:96px;height:auto;filter:drop-shadow(0 6px 6px rgba(0,0,0,.2))}
.soonbox{margin-top:26px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;padding:36px 20px;border:2px dashed var(--line);border-radius:26px;background:var(--surface)}
.soonbox span{font-size:52px;animation:bob 2.4s ease-in-out infinite}
.soonbox b{font-family:var(--display);font-size:24px}
.soonbox p{margin:0;color:var(--muted)}

/* about */
.about{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin-top:26px}
.about article{--c:var(--sky);background:var(--surface);border:2px solid var(--line);border-radius:26px;padding:22px;position:relative;overflow:hidden;animation:rise .45s both}
.about article.wide{grid-column:1/-1}
.about h3{margin:0 0 8px;font-family:var(--display);font-size:24px;font-weight:800;color:var(--c);display:flex;align-items:center;gap:10px}
.about h3 span{width:40px;height:40px;border-radius:12px;background:var(--c);color:#fff;display:grid;place-items:center}
.about p{margin:0;max-width:70ch}
.pills{display:flex;flex-wrap:wrap;gap:10px}
.pill{--c:var(--sky);font-weight:700;padding:8px 18px;border-radius:999px;background:var(--c);color:#fff;animation:bob 3s ease-in-out infinite}
.pill:nth-child(2){animation-delay:.3s}.pill:nth-child(3){animation-delay:.6s}.pill:nth-child(4){animation-delay:.9s}.pill:nth-child(5){animation-delay:1.2s}
.contact{display:flex;flex-wrap:wrap;gap:12px}
.contact a{display:inline-flex;gap:10px;align-items:center;text-decoration:none;border:2px solid var(--line);border-radius:16px;padding:10px 16px;font-weight:700;transition:transform .15s,border-color .15s}
.contact a:hover{transform:translateY(-3px);border-color:var(--c)}
.empty{color:var(--muted);padding:20px 0}

footer{position:relative;margin-top:30px;background:var(--ink);color:var(--bg)}
footer svg.wave{display:block;width:100%;height:40px;color:var(--ink);margin-bottom:-1px;position:absolute;top:-39px}
footer .wrap{padding-block:26px;display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;font-size:15px}
footer b{font-family:var(--display);font-size:20px}

@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes spin{to{rotate:360deg}}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-40px)}}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-10px)}60%{transform:translateY(0)}}
@keyframes waveArm{0%,100%{transform:rotate(0)}50%{transform:rotate(-22deg)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes sway{0%,100%{transform:rotate(0)}50%{transform:rotate(1.5deg)}}
@keyframes wave{0%,100%{transform:skewY(0)}50%{transform:skewY(-8deg)}}
@keyframes marquee{to{transform:translateX(50%)}}
@keyframes rise{from{transform:translateY(14px)}to{transform:none}}

@media (max-width:820px){.hero-in{grid-template-columns:1fr}.scene{max-width:400px}.stats{grid-template-columns:repeat(2,1fr)}.about{grid-template-columns:1fr}}
@media (max-width:420px){.stat b{font-size:28px}.banner .ic{width:58px;height:58px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

nav.innerHTML = NAV.map(s=>`<button type="button" data-id="${s.id}" style="${cvar(s)}">${s.name}</button>`).join('');
nav.addEventListener('click',e=>{const b=e.target.closest('button');if(b)go(b.dataset.id)});

  <div class="ribbon" aria-label="قيم المدرسة"><div class="track">${Array(4).fill('<span>الابتكار</span><span>الجودة</span><span>المسؤولية</span><span>الأمان والانتماء</span><span>التعاون</span>').join('')}</div></div>

function countUp(){
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  document.querySelectorAll('.stat b').forEach(el=>{
    const n=+el.dataset.n; if(reduce){el.textContent=AR(n);return}
    let t0=null; const step=t=>{t0??=t;const p=Math.min(1,(t-t0)/900);el.textContent=AR(Math.round(n*(1-Math.pow(1-p,3))));if(p<1)requestAnimationFrame(step)};
    requestAnimationFrame(step);
  });
}

let confettiRAF;
function confetti(){
  cancelAnimationFrame(confettiRAF);
  const cv=document.getElementById('confetti'); if(!cv) return;
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const ctx=cv.getContext('2d'); const cs=getComputedStyle(document.documentElement);
  const cols=['--sun','--coral','--sky','--mint','--grape','--pink'].map(v=>cs.getPropertyValue(v).trim());
  let W,H; const fit=()=>{const r=cv.getBoundingClientRect();W=cv.width=r.width*devicePixelRatio;H=cv.height=r.height*devicePixelRatio};fit();
  const P=Array.from({length:34},()=>({x:Math.random(),y:Math.random(),r:3+Math.random()*5,v:.0006+Math.random()*.0012,a:Math.random()*6.28,s:(Math.random()-.5)*.04,c:cols[Math.floor(Math.random()*cols.length)],sh:Math.random()<.5}));
  const tick=()=>{ if(!document.body.contains(cv)) return;
    if(cv.width!==Math.round(cv.getBoundingClientRect().width*devicePixelRatio)) fit();
    ctx.clearRect(0,0,W,H);
    for(const p of P){p.y+=p.v;p.a+=p.s;if(p.y>1.05){p.y=-.05;p.x=Math.random()}
      ctx.save();ctx.translate(p.x*W,p.y*H);ctx.rotate(p.a);ctx.globalAlpha=.55;ctx.fillStyle=p.c;
      const r=p.r*devicePixelRatio; if(p.sh) ctx.fillRect(-r,-r/2,r*2,r); else {ctx.beginPath();ctx.arc(0,0,r*.7,0,6.28);ctx.fill()}
      ctx.restore()}
    confettiRAF=requestAnimationFrame(tick)};
  tick();
}

const PAIR={'--sky':'--grape','--mint':'--sky','--coral':'--sun','--sun':'--coral','--pink':'--coral','--grape':'--pink'};
function fancy(s,fl,tipIcon,tip){
  view.innerHTML = banner(s).replace('</section>', `<div class="floaters" aria-hidden="true">${fl.map((e,i)=>`<span style="--x:${8+i*11.5}%;--d:${i*.7}s;--t:${6+i%3*1.5}s">${e}</span>`).join('')}</div></section>`) +
  (s.items.length?'':`<div class="soonbox"><span>🌸</span><b>المحتوى قيد الإضافة</b><p>ستظهر هنا أعمال القسم قريبًا.</p></div>`) +
  `<div class="ifeats auto" style="margin-top:26px">` + s.items.map((it,k)=>!it.url?`
    <div class="feat ifeat soon" style="--c:var(${it.c});--g:var(${PAIR[it.c]});animation-delay:${k*80}ms">
      <span class="feat-art mini"><span class="big">${it.emoji}</span></span>
      <span class="feat-body"><b>${it.name}</b><span class="feat-tag">قريبًا</span></span>
    </div>`:`
    <a class="feat ifeat" href="${it.url}" target="_blank" rel="noopener" style="--c:var(${it.c});--g:var(${PAIR[it.c]});animation-delay:${k*80}ms">
      <span class="feat-art mini"><i class="sp a">✦</i><i class="sp b">✦</i><i class="sp c">✦</i>
        <span class="big" style="animation-delay:-${k*.4}s">${it.flag?`<img class="flagimg" src="${FLAG}" alt="">`:it.emoji}</span></span>
      <span class="feat-body"><b>${it.name}</b><span class="feat-go">${it.type==='form'?'افتح النموذج':it.type==='site'?'زيارة الموقع':'افتح'} ${svg('arrow',16,3)}</span></span>
    </a>`).join('') + `</div>
  <div class="tip"><i>${tipIcon}</i>${tip}</div>`;
}

function activities(s){
  const fl=['🎭','⚽','🎨','🎵','🎙️','⛺','📷','🏅'];
  const by=n=>s.items.find(it=>it.name.includes(n));
  const GR=[
    ['الفنون والإعلام','مواهب تُعرض على المسرح وفي الإذاعة وعلى الورق','--pink',['المسرح','الإذاعة','الفنون','الموسيقية','التنسيق']],
    ['الصحة والرياضة والسلامة','جسم سليم وبيئة مدرسية آمنة','--mint',['الصحة','التربية البدنية','الأمن']],
    ['القيم والمهارات','قرآن، وكشافة، ومهارات المستقبل','--grape',['القرآن','الأشبال','تقنية']]];
  let k=0;
  view.innerHTML = banner(s).replace('</section>', `<div class="floaters" aria-hidden="true">${fl.map((e,i)=>`<span style="--x:${8+i*11.5}%;--d:${i*.7}s;--t:${6+i%3*1.5}s">${e}</span>`).join('')}</div></section>`) +
  GR.map(([t,sub,dc,names])=>`<div class="igroup"><h3><span class="dot" style="--c:var(${dc})"></span>${t}</h3><p>${sub}</p></div>
  <div class="ifeats auto">` + names.map(by).filter(Boolean).map(it=>`
    <a class="feat ifeat" href="${it.url}" target="_blank" rel="noopener" style="--c:var(${it.c});--g:var(${PAIR[it.c]});animation-delay:${(k++)*70}ms">
      <span class="feat-art mini"><i class="sp a">✦</i><i class="sp b">✦</i><i class="sp c">✦</i>
        <span class="big" style="animation-delay:-${k*.4}s">${it.emoji}</span></span>
      <span class="feat-body"><b>${it.name}</b><span class="feat-go">${it.type==='site'?'زيارة الموقع':'افتح'} ${svg('arrow',16,3)}</span></span>
    </a>`).join('') + `</div>`).join('') +
  `<div class="tip"><i>🎉</i>أحد عشر نشاطًا تصنع يومًا مدرسيًّا مليئًا بالحياة والإبداع.</div>`;
}

function initiatives(s){
  const fl=['💡','🌱','🤝','🚀','✨','🎯','🎈','🌟'];
  const GR=[['مبادرات الإدارة','مبادرات تقودها إدارة المدرسة',2,'--sun','auto'],['مبادرات المجالات','أربعة مجالات، لكل مجال بصمته',0,'--coral','four'],['مبادرات المعلمات المتخصصات','الدمج، صعوبات التعلم، والتربية العملية',1,'--grape','three']];
  let k=0;
  view.innerHTML = banner(s).replace('</section>', `<div class="floaters" aria-hidden="true">${fl.map((e,i)=>`<span style="--x:${8+i*11.5}%;--d:${i*.7}s;--t:${6+i%3*1.5}s">${e}</span>`).join('')}</div></section>`) +
  GR.map(([t,sub,gi,dc,cls])=>`<div class="igroup"><h3><span class="dot" style="--c:var(${dc})"></span>${t}</h3><p>${sub}</p></div>
  <div class="ifeats ${cls}">` + s.items.filter(it=>it.grp===gi).map(it=>`
    <a class="feat ifeat" href="${it.url}" target="_blank" rel="noopener" style="--c:var(${it.c});--g:var(${it.g});animation-delay:${(k++)*80}ms">
      <span class="feat-art mini">
        <i class="sp a">✦</i><i class="sp b">✦</i><i class="sp c">✦</i>
        ${it.n?`<span class="num">${it.n}</span>`:''}
        <span class="big" style="animation-delay:-${k*.4}s">${it.emoji}</span>
      </span>
      <span class="feat-body"><b>${it.name}</b><span class="feat-go">افتح ${svg('arrow',16,3)}</span></span>
    </a>`).join('') + `</div>`).join('') +
  `<div class="tip"><i>💡</i>كل مبادرة تبدأ بفكرة صغيرة، وهنا نوثّق أثرها الكبير.</div>`;
}

function students(s){
  const floaters=['⭐','🏆','📚','✏️','🎓','💡','🌟','📈'];
  view.innerHTML = banner(s).replace('</section>', `<div class="floaters" aria-hidden="true">${floaters.map((e,i)=>`<span style="--x:${8+i*11.5}%;--d:${i*.7}s;--t:${6+i%3*1.5}s">${e}</span>`).join('')}</div></section>`) +

      <span class="feat-art">${FEAT_ART[it.art]}</span>
      <span class="feat-body">
        <span class="feat-tag">${it.tag}</span>
        <b>${it.name}</b>
        <span class="feat-txt">${it.blurb}</span>
        <span class="feat-go">افتح المجلد ${svg('arrow',18,3)}</span>
      </span>
    </a>`).join('') + `</div>
  <div class="tip"><i>🌟</i>كل طالب في جيل السلام نجم، ونتابع تقدّمه خطوة بخطوة.</div>`;
}

function section(s){
  view.innerHTML = banner(s) + `<div class="tiles">` + s.items.map((it,i)=>{
    const same=s.items.filter(x=>x.type===it.type); const n=same.indexOf(it)+1;
    const label=it.name||`${TYPE_LABEL[it.type]} ${s.name}${same.length>1?' '+AR(n):''}`;
    const c=it.c||s.c;
    const art=it.emoji?`<span class="emo">${it.emoji}</span>`:ART[it.type](c);
    if(!it.url) return `<div class="tile soon" style="--c:var(${c});animation-delay:${i*45}ms">
      <span class="art">${art}</span><b>${label}</b><span class="meta">لم يُضَف المجلد بعد<em>قريبًا</em></span></div>`;
    return `<a class="tile" href="${it.url}" target="_blank" rel="noopener" style="--c:var(${c});animation-delay:${i*45}ms">
      <span class="art">${art}</span>
      <b>${label}</b>
      <span class="meta">${TYPE_SUB[it.type]}<em>فتح ↖</em></span>
    </a>`}).join('') + `</div>
  <div class="tip"><i>💡</i>تُفتح الملفات في Google Drive، وأي ملف جديد يُضاف إلى المجلد يظهر مباشرة.</div>`;
}

function go(id){
  const s = SECTIONS.find(x=>x.id===id);
  if(!s) home(); else if(s.id==='about') about(s); else if(s.id==='students') students(s); else if(s.id==='initiatives') initiatives(s); else if(s.id==='activities') activities(s); else if(s.id==='parents') fancy(s,['👪','🤝','🏡','💬','💚','📅','🌱','✨'],'🏡','المدرسة والبيت شريكان في بناء جيل السلام.'); else if(s.id==='contests') fancy(s,['🏆','🥇','🎖️','⭐','🎉','🥈','🏅','✨'],'🏆','كل مشاركة فوز، وكل طالب بطل في جيل السلام.'); else if(s.id==='social') fancy(s,['💛','🤗','🌸','🤝','🌈','💬','🌟','🌼'],'💛','طالب مطمئن، طالب يتعلّم ويُبدع.'); else if(s.id==='general') fancy(s,['📋','✅','📊','🔍','🏆','📈','⭐','💡'],'📈','نقيّم أنفسنا بصدق، لنتحسّن باستمرار.'); else if(s.id==='plc') fancy(s,['🤝','🔬','📚','💡','🏫','✍️','🌐','✨'],'🤝','نتعلّم معًا وننمو معًا، بالتوأمة والبحث وتبادل الخبرات.'); else if(s.id==='attendance') fancy(s,['⏰','📅','✅','🚌','🎒','🔔','👪','🌞'],'🌞','الانتظام أول خطوة نحو التميّز، للطلبة والمعلمات معًا.'); else { const X=EXTRA[s.id]||EXTRA._; fancy(s,X[0],X[1],X[2]); }
  [...nav.children].forEach(b=>{ if(b.dataset.id===(s?s.id:'home')) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); });
  const cur = nav.querySelector('[aria-current]'); if(cur) cur.scrollIntoView({block:'nearest',inline:'center'});
  try{ history.replaceState(null,'', s ? '#'+s.id : '#home'); }catch(e){}
  window.scrollTo(0,0);
}
go((location.hash||'').slice(1)||'home');
